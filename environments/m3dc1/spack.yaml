# M3D-C1 environment

spack:
  specs:
  - matrix:
    - [m3dc1@master]
    - [~3d ~complex, ~3d +complex, +3d ~complex, +3d +st ~complex]

  repos:
    scorec: $env/../../spack_repo/scorec

  packages:
    all:
      # GitHub runners vary in architecture
      require: target=x86_64_v3

  concretizer:
    # Required so mutually exclusive variants can coexist in one environment.
    unify: false
    reuse: false

  config:
    install_tree:
      # Padding lets binaries from the build cache relocate to any install root.
      padded_length: 128

  view: false
