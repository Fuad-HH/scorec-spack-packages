spack:
  specs:
  - matrix:
    - [pcms@develop]
    - ['~python', '+python']
    - ['~petsc', '+petsc']
    - ['^kokkos+serial+openmp']

  repos:
    scorec: $env/../../spack_repo/scorec

  packages:
    kokkos-kernels:
      # PETSc's configure needs kokkos-kernels instantiated for the enabled backends.
      require: '+execspace_serial+execspace_openmp'

  concretizer:
    # Required so mutually exclusive variants can coexist in one environment.
    unify: false
    reuse: false

  config:
    install_tree:
      # Padding lets binaries from the build cache relocate to any install root.
      padded_length: 128

  view: false
